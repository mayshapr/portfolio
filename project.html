<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Maysha Aprillia - Project Detail">
    <title>Project Detail | Maysha Aprillia</title>
	<link rel="icon" type="image/png" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-pink: #ec4899; --hover-pink: #db2777; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }
        .font-heading { font-family: 'Outfit', sans-serif; }

        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }

        /* Hero */
        .detail-hero {
            position: relative;
            width: 100%;
            height: 60vh;
            min-height: 380px;
            max-height: 620px;
            overflow: hidden;
        }
        .detail-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15,23,42,0.15) 0%, rgba(15,23,42,0.15) 40%, rgba(15,23,42,0.85) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Gallery masonry */
        .gallery-masonry {
            columns: 1;
            column-gap: 20px;
        }
        @media (min-width: 640px) {
            .gallery-masonry { columns: 2; }
        }
        .gallery-masonry figure {
            break-inside: avoid;
            margin: 0 0 20px 0;
            border-radius: 24px;
            overflow: hidden;
            background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .dark .gallery-masonry figure { background: #1e293b; border-color: rgba(255,255,255,0.05); }
        .gallery-masonry img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }
        .gallery-masonry figure:hover img { transform: scale(1.05); }

        .stat-card {
            background: #fff;
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 24px;
            padding: 24px 28px;
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.05);
        }
        .dark .stat-card { background: #1e293b; border-color: rgba(255,255,255,0.06); }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .back-btn i { transition: transform 0.3s ease; }
        .back-btn:hover i { transform: translateX(-4px); }

        /* ===== Story block system — six distinct layout modules ===== */

        /* shared eyebrow + heading tokens */
        .block-num {
            display: inline-block;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--primary-pink);
            margin-bottom: 10px;
        }
        .block-heading {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }
        .dark .block-heading { color: #f1f5f9; }
        @media (min-width: 768px) { .block-heading { font-size: 26px; } }
        .block-body p, .block-body { color: #475569; line-height: 1.8; text-align: justify; }
        .dark .block-body p, .dark .block-body { color: #94a3b8; }

        /* 1. SPLIT — image + text side by side, side is explicit per block */
        .block-split { display: flex; flex-direction: column; gap: 28px; align-items: center; margin-bottom: 64px; }
        @media (min-width: 768px) {
            .block-split { flex-direction: row; gap: 48px; }
            .block-split.side-right { flex-direction: row-reverse; }
        }
        .block-split-media {
            width: 100%; border-radius: 24px; overflow: hidden; background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.05); aspect-ratio: 4 / 3; flex-shrink: 0;
        }
        .dark .block-split-media { background: #1e293b; border-color: rgba(255,255,255,0.05); }
        @media (min-width: 768px) { .block-split-media { width: 44%; } }
        .block-split-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .block-split-text { flex: 1; }

        /* 2. FULL — full-width media, centered text below, editorial/magazine feel */
        .block-full { margin-bottom: 64px; }
        .block-full-media {
            width: 100%; border-radius: 28px; overflow: hidden; background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.05); aspect-ratio: 16 / 9; margin-bottom: 28px;
        }
        .dark .block-full-media { background: #1e293b; border-color: rgba(255,255,255,0.05); }
        .block-full-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .block-full-text { max-width: 640px; margin: 0 auto; text-align: center; }
        .block-full-text .block-body { text-align: justify; }

        /* 3. DUO — a diptych of two images, text spans below */
        .block-duo { margin-bottom: 64px; }
        .block-duo-media { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
        .block-duo-media figure {
            border-radius: 20px; overflow: hidden; background: #f1f5f9;
            border: 1px solid rgba(0,0,0,0.05); aspect-ratio: 4 / 5; margin: 0;
        }
        .dark .block-duo-media figure { background: #1e293b; border-color: rgba(255,255,255,0.05); }
        .block-duo-media img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* 4. QUOTE — a pull-quote break, no image, no numbering */
        .block-quote {
            max-width: 720px; margin: 0 auto 64px; padding: 4px 0 4px 28px;
            border-left: 3px solid var(--primary-pink);
        }
        .block-quote p {
            font-family: 'Outfit', sans-serif; font-style: italic; font-weight: 600;
            font-size: 21px; line-height: 1.55; color: #0f172a;
        }
        .dark .block-quote p { color: #f1f5f9; }
        @media (min-width: 768px) { .block-quote p { font-size: 25px; } }

        /* 5. TIMELINE — vertical rail of named steps, for genuine sequences */
        .block-timeline { margin-bottom: 64px; }
        .block-timeline-rail { position: relative; padding-left: 30px; margin-top: 22px; }
        .block-timeline-rail::before {
            content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px;
            background: linear-gradient(to bottom, rgba(236,72,153,0.4), rgba(236,72,153,0.05));
        }
        .block-timeline-step { position: relative; margin-bottom: 24px; }
        .block-timeline-step:last-child { margin-bottom: 0; }
        .block-timeline-dot {
            position: absolute; left: -30px; top: 4px; width: 14px; height: 14px; border-radius: 50%;
            background: var(--primary-pink); box-shadow: 0 0 0 4px rgba(236,72,153,0.15);
        }
        .block-timeline-label {
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 15px;
            color: #0f172a; margin-bottom: 3px;
        }
        .dark .block-timeline-label { color: #f1f5f9; }
        .block-timeline-step p { color: #475569; line-height: 1.7; text-align: left; }
        .dark .block-timeline-step p { color: #94a3b8; }

        /* 6. STAT — a callout number, no numbering */
        .block-stat {
            text-align: center; margin: 0 auto 64px; padding: 40px 28px; border-radius: 28px;
            background: linear-gradient(135deg, rgba(236,72,153,0.06), rgba(219,39,119,0.03));
            border: 1px solid rgba(236,72,153,0.14);
        }
        .block-stat-value {
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 52px; line-height: 1;
            background: linear-gradient(135deg, #ec4899, #db2777);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        @media (min-width: 768px) { .block-stat-value { font-size: 64px; } }
        .block-stat-label {
            font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
            color: var(--hover-pink); margin-top: 12px;
        }
        .block-stat-caption { margin-top: 14px; color: #475569; max-width: 460px; margin-left: auto; margin-right: auto; line-height: 1.7; }
        .dark .block-stat-caption { color: #94a3b8; }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">

    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-pink-200/40 dark:bg-pink-900/20 rounded-full blur-3xl animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-rose-200/40 dark:bg-rose-900/20 rounded-full blur-3xl animate-blob" style="animation-delay: 2s;"></div>
    </div>

    <!-- Top bar -->
    <div class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 md:px-12 py-5">
        <a href="index.html" class="back-btn px-5 py-3 rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm border border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-pink-500 dark:hover:text-pink-400 transition-colors">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Portfolio</span>
        </a>
        <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm text-slate-600 dark:text-slate-300 transition-all hover:scale-110">
            <i id="moonIcon" class="fa-solid fa-moon"></i>
            <i id="sunIcon" class="fa-solid fa-sun hidden"></i>
        </button>
    </div>

    <!-- Hero -->
    <section class="detail-hero">
        <img id="pImg" class="detail-hero-img" src="" alt="">
        <div class="detail-hero-overlay">
            <div class="max-w-5xl mx-auto w-full px-6 md:px-12 pb-12">
                <span id="pBadge" class="inline-block px-4 py-1.5 bg-pink-500 text-white rounded-full text-[10px] font-black uppercase tracking-widest mb-4"></span>
                <h1 id="pTitle" class="text-4xl md:text-6xl font-heading font-black text-white leading-tight tracking-tighter"></h1>
            </div>
        </div>
    </section>

    <!-- Content -->
    <main class="max-w-5xl mx-auto px-6 md:px-12 py-16">

        <div class="reveal mb-14">
            <p id="pDesc" class="text-xl md:text-2xl text-slate-700 dark:text-slate-200 leading-relaxed font-semibold text-justify"></p>
        </div>

        <div class="reveal grid sm:grid-cols-2 gap-6 mb-16">
            <div class="stat-card">
                <span class="block text-[10px] font-black text-pink-500 uppercase tracking-widest mb-2">Impact</span>
                <p id="pImpact" class="font-bold text-lg text-slate-900 dark:text-white"></p>
            </div>
            <div class="stat-card">
                <span class="block text-[10px] font-black text-pink-500 uppercase tracking-widest mb-2">Tools & Stack</span>
                <p id="pStack" class="font-bold text-lg text-slate-900 dark:text-white"></p>
            </div>
        </div>

        <div class="reveal mb-16" id="storySection">
            <h3 id="storySectionTitle" class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-8">Behind The Scenes</h3>
            <div id="storyContainer"></div>
        </div>

        <div class="reveal">
            <h3 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-5">Gallery</h3>
            <div id="pGallery" class="gallery-masonry"></div>
        </div>

        <div class="reveal mt-20 border-t border-slate-100 dark:border-slate-800 pt-12 text-center">
            <p class="text-slate-500 dark:text-slate-400 mb-5">Curious about the full story behind this project?</p>
            <a id="pContactLink" href="#" target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-3 px-8 py-4 rounded-full font-black text-sm text-white transition-all duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-pink-500/30"
               style="background: #ec4899;">
                <i class="fa-solid fa-envelope"></i>
                Let's talk about this project
            </a>
        </div>

        <div class="reveal mt-16 flex items-center justify-between border-t border-slate-100 dark:border-slate-800 pt-8">
            <a id="prevProject" href="#" class="text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-pink-500 transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i>Previous
            </a>
            <a href="index.html#project" class="text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-pink-500 transition-colors">
                All Projects
            </a>
            <a id="nextProject" href="#" class="text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-pink-500 transition-colors">
                Next<i class="fa-solid fa-arrow-right ml-2"></i>
            </a>
        </div>
    </main>

    <footer class="text-center pb-16">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">Crafted with ❤️ & caffeine — 2026</p>
    </footer>

    <script src="projects-data.js"></script>
    <script>
        function renderStory(data) {
            const container = document.getElementById('storyContainer');
            const titleEl = document.getElementById('storySectionTitle');

            if (Array.isArray(data.story) && data.story.length) {
                titleEl.innerText = data.storyTitle || 'Behind The Scenes';
                let chapterCount = 0;
                const numberedTypes = ['split', 'full', 'duo', 'timeline'];

                container.innerHTML = data.story.map((b) => {
                    const type = b.type || 'split';
                    const isNumbered = numberedTypes.includes(type);
                    if (isNumbered) chapterCount++;
                    const numTag = isNumbered
                        ? `<span class="block-num">Chapter ${String(chapterCount).padStart(2, '0')}</span>`
                        : '';

                    if (type === 'split') {
                        const sideCls = b.side === 'right' ? ' side-right' : '';
                        return `
                        <div class="block-split reveal active${sideCls}">
                            <div class="block-split-media">
                                <img src="${b.img}" alt="${data.title} - ${b.heading}" loading="lazy">
                            </div>
                            <div class="block-split-text">
                                ${numTag}
                                <h4 class="block-heading">${b.heading}</h4>
                                <div class="block-body"><p>${b.text}</p></div>
                            </div>
                        </div>`;
                    }

                    if (type === 'full') {
                        return `
                        <div class="block-full reveal">
                            <div class="block-full-media">
                                <img src="${b.img}" alt="${data.title} - ${b.heading}" loading="lazy">
                            </div>
                            <div class="block-full-text">
                                ${numTag}
                                <h4 class="block-heading">${b.heading}</h4>
                                <div class="block-body"><p>${b.text}</p></div>
                            </div>
                        </div>`;
                    }

                    if (type === 'duo') {
                        const imgs = (b.imgs || []).map(src =>
                            `<figure><img src="${src}" alt="${data.title} - ${b.heading}" loading="lazy"></figure>`
                        ).join('');
                        return `
                        <div class="block-duo reveal">
                            <div class="block-duo-media">${imgs}</div>
                            ${numTag}
                            <h4 class="block-heading">${b.heading}</h4>
                            <div class="block-body"><p>${b.text}</p></div>
                        </div>`;
                    }

                    if (type === 'quote') {
                        return `
                        <div class="block-quote reveal">
                            <p>${b.quote}</p>
                        </div>`;
                    }

                    if (type === 'timeline') {
                        const steps = (b.steps || []).map(s => `
                            <div class="block-timeline-step">
                                <span class="block-timeline-dot"></span>
                                <div class="block-timeline-label">${s.label}</div>
                                <p>${s.text}</p>
                            </div>`).join('');
                        return `
                        <div class="block-timeline reveal">
                            ${numTag}
                            <h4 class="block-heading">${b.heading}</h4>
                            ${b.intro ? `<div class="block-body"><p>${b.intro}</p></div>` : ''}
                            <div class="block-timeline-rail">${steps}</div>
                        </div>`;
                    }

                    if (type === 'stat') {
                        return `
                        <div class="block-stat reveal">
                            <div class="block-stat-value">${b.value}</div>
                            <div class="block-stat-label">${b.label}</div>
                            ${b.caption ? `<div class="block-stat-caption">${b.caption}</div>` : ''}
                        </div>`;
                    }

                    return '';
                }).join('');
            } else {
                titleEl.innerText = 'The Process';
                container.innerHTML = `<p class="text-slate-600 dark:text-slate-400 text-base md:text-lg leading-relaxed text-justify">${data.process || ''}</p>`;
            }
        }

        function getProjectId() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'), 10);
            if (isNaN(id) || id < 0 || id >= projectData.length) return 0;
            return id;
        }

        function renderProject() {
            const id = getProjectId();
            const data = projectData[id];
            if (!data) return;

            document.title = `${data.title} | Maysha Aprillia`;

            document.getElementById('pImg').src = data.img;
            document.getElementById('pImg').alt = data.title;
            document.getElementById('pBadge').innerText = data.badge;
            document.getElementById('pTitle').innerText = data.title;
            document.getElementById('pDesc').innerText = data.desc;
            document.getElementById('pImpact').innerText = data.impact;
            document.getElementById('pStack').innerText = data.stack;
            renderStory(data);

            const galleryEl = document.getElementById('pGallery');
            galleryEl.innerHTML = (data.gallery || []).map((src, i) => `
                <figure>
                    <img src="${src}" alt="${data.title} - detail ${i + 1}" loading="lazy">
                </figure>
            `).join('');

            const emailAddress = 'maysha9910@gmail.com';
            const emailSubject = encodeURIComponent(`Let's talk — ${data.title}`);
            const emailBody = encodeURIComponent(`Hi Maysha!\n\nI just saw your project "${data.title}" on your portfolio and I'd love to know more about it.\n\n`);
            document.getElementById('pContactLink').href = `mailto:${emailAddress}?subject=${emailSubject}&body=${emailBody}`;

            const prevId = (id - 1 + projectData.length) % projectData.length;
            const nextId = (id + 1) % projectData.length;
            document.getElementById('prevProject').href = `project.html?id=${prevId}`;
            document.getElementById('nextProject').href = `project.html?id=${nextId}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProject();

            const themeToggle = document.getElementById('themeToggle');
            const moonIcon = document.getElementById('moonIcon');
            const sunIcon = document.getElementById('sunIcon');
            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    document.body.classList.toggle('dark');
                    moonIcon.classList.toggle('hidden');
                    sunIcon.classList.toggle('hidden');
                });
            }

            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
